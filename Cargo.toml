[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/gui", "crates/steam-helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
rimdeck-core = { path = "crates/core" }
# Texture optimizer (todds replacement).
ddsify = { version = "0.1", default-features = false }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
